                    data: rows.map(r => parseFloat(r[fIdx >= 0 ? fIdx : fi + 1]) || 0),
                    itemStyle: {
                        color: CHART_COLORS[fi % CHART_COLORS.length],
                        borderRadius: [4, 4, 0, 0]
                    },
                    barMaxWidth: 30
                };
            })
        };
    }

    if (type === 'scatter') {
        const yLabel = yField || columns[1];
        return {
            ...base,
            tooltip: {
                trigger: 'item',
                formatter: function(p) { return labels[p.dataIndex] + '<br/>' + xField + ': ' + p.value[0] + '<br/>' + yLabel + ': ' + p.value[1]; }
            },
            xAxis: {
                type: 'value',
                name: xField,
                nameLocation: 'center',
                nameGap: 30,
                axisLabel: { fontSize: 11, color: '#777' },
                splitLine: { lineStyle: { color: '#f1f5f9' } }
            },
            yAxis: {
                type: 'value',
                name: yLabel,
                nameLocation: 'center',
                nameGap: 40,
                axisLabel: { fontSize: 11, color: '#777' },
                splitLine: { lineStyle: { color: '#f1f5f9' } }
            },
            series: [{
                type: 'scatter',
                data: rows.map(r => [parseFloat(r[xIdx]) || 0, parseFloat(r[yIdx]) || 0]),
                symbolSize: 10,
                itemStyle: { color: '#16a34a', opacity: 0.7 }
            }]
        };
    }

    // Fallback: vertical bar
    return buildChartOption({ ...config, type: 'bar' }, columns, rows);
}

// ── Chart toolbar functions ──

function toggleChartExpand(chartId, btn) {
    const el = document.getElementById(chartId);
    if (!el) return;
    const expanded = el.classList.toggle('expanded');
    btn.querySelector('span').textContent = expanded ? '\u2921 Collapse' : '\u2922 Expand';
    if (el._echartInstance) setTimeout(() => el._echartInstance.resize(), 350);
}

function copyChart(chartId, btn) {
    const el = document.getElementById(chartId);
    if (!el || !el._echartInstance) return;

    const url = el._echartInstance.getDataURL({
        pixelRatio: 3,
        backgroundColor: '#fff'
    });

    // Convert data URL to blob for clipboard
    fetch(url).then(r => r.blob()).then(blob => {
        const item = new ClipboardItem({ 'image/png': blob });
        navigator.clipboard.write([item]).then(() => {
            btn.classList.add('copied');
            setTimeout(() => btn.classList.remove('copied'), 1500);
        }).catch(() => {
            // Fallback: download
            downloadChartFromURL(url, chartId);
        });
    });
}

function downloadChart(chartId) {
    const el = document.getElementById(chartId);
    if (!el || !el._echartInstance) return;
    const url = el._echartInstance.getDataURL({
        pixelRatio: 3,
        backgroundColor: '#fff'
    });
    downloadChartFromURL(url, chartId);
}

function downloadChartFromURL(url, name) {
    const a = document.createElement('a');
    a.href = url;
    a.download = 'cricket-chart-' + Date.now() + '.png';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
}

// CHAT / ASK
// ═══════════════════════════════════════════════════════════════════

const chatContainer = document.getElementById('chat-container');
const input = document.getElementById('question-input');
const sendBtn = document.getElementById('send-btn');

input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !sendBtn.disabled) sendQuestion();
});

// Handle Enter in rename modal
document.getElementById('rename-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') confirmRename();
    if (e.key === 'Escape') closeRenameModal();
});

function askExample(btn) {
    input.value = btn.textContent;
    sendQuestion();
}

function retryQuestion(q) {
    input.value = q;
    sendQuestion();
}

function askWithPlayer(playerName, originalQ) {
    // Replace ambiguous name in original question with the selected full name
    input.value = originalQ + ' (player: ' + playerName + ')';
    sendQuestion();
}

async function sendQuestion() {
    const question = input.value.trim();
    if (!question) return;

    // Ensure there's an active session
    let session = getActiveSession();
    if (!session) {
        createNewSession();
        session = getActiveSession();
    }

    // Remove examples
    const examples = document.getElementById('examples');
    if (examples) examples.remove();

    // Save and show user message
    addMessage(session.id, { role: 'user', content: question });
    appendMessageDOM('user', question);
    renderSessionList(); // Update title if auto-named

    input.value = '';
    sendBtn.disabled = true;

    // Loading indicator
    const loadingEl = document.createElement('div');
    loadingEl.className = 'loading';
    loadingEl.textContent = 'Thinking';
    chatContainer.appendChild(loadingEl);
    chatContainer.scrollTop = chatContainer.scrollHeight;

    try {
        // Build compact history: previous question + context_summary pairs
        const currentSession = getActiveSession();
        const history = [];
        if (currentSession) {
            let lastQuestion = null;
            for (const msg of currentSession.messages) {
                if (msg.role === 'user') {
                    lastQuestion = msg.content;
                } else if (msg.role === 'assistant' && lastQuestion) {
                    history.push({
                        question: lastQuestion,
                        context_summary: (msg.data && msg.data.context_summary) || '',
                        sql: (msg.data && msg.data.sql) || ''
                    });
                    lastQuestion = null;
                }
            }
            // Don't include the current question (it's sent separately)
        }

        const resp = await fetch('/api/ask', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ question, history }),
        });
        const data = await resp.json();
        loadingEl.remove();

        // Save assistant message
        addMessage(session.id, { role: 'assistant', data: data });
        appendAssistantDOM(data, !!data.error);
    } catch (err) {
        loadingEl.remove();
        appendMessageDOM('error', 'Connection error: ' + err.message);
    }

    sendBtn.disabled = false;
    input.focus();
    chatContainer.scrollTop = chatContainer.scrollHeight;
}

function toggleSql(id) {
    const el = document.getElementById(id);
    const toggle = el.previousElementSibling;
    if (el.style.display === 'block') {
        el.style.display = 'none';
        toggle.innerHTML = '&#9654; Show SQL query';
    } else {
        el.style.display = 'block';
        toggle.innerHTML = '&#9660; Hide SQL query';
    }
}

function escapeHtml(text) {
    const d = document.createElement('div');
    d.textContent = text;
    return d.innerHTML;
}



function formatRelativeTime(ts) {
    const diff = Date.now() - ts;
    const mins = Math.floor(diff / 60000);
    if (mins < 1) return 'just now';
    if (mins < 60) return mins + 'm ago';
    const hrs = Math.floor(mins / 60);
    if (hrs < 24) return hrs + 'h ago';
    const days = Math.floor(hrs / 24);
    if (days < 7) return days + 'd ago';
    return new Date(ts).toLocaleDateString();
}

// Load DB stats
fetch('/api/stats')
    .then(r => r.json())
    .then(stats => {
        const parts = [];
        if (stats.matches) parts.push(stats.matches.toLocaleString() + ' matches');
        if (stats.deliveries) parts.push(stats.deliveries.toLocaleString() + ' deliveries');
        document.getElementById('db-stats').textContent = parts.join(' \u00B7 ');
    })
    .catch(() => {});

// Initialize sessions
(function init() {
    const sessions = loadSessions();
    const activeId = getActiveSessionId();

    if (sessions.length === 0 || !sessions.find(s => s.id === activeId)) {
        createNewSession();
    } else {
        renderSessionList();
        renderChat();
    }
})();
